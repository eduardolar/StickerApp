<nav aria-label="Navegación principal" class="w-full px-4">
  <p class="mb-3 px-3 text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500">
    Explorar
  </p>

  <div class="space-y-1.5">
    @for (option of menuOptions; track option.route) {
      <a
        [routerLink]="option.route"
        routerLinkActive="bg-indigo-500/10 ring-1 ring-inset ring-indigo-400/20"
        [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
        ariaCurrentWhenActive="page"
        #activeLink="routerLinkActive"
        class="group relative flex w-full items-center gap-3 rounded-xl px-3 py-3 text-slate-300 transition duration-200 hover:bg-white/5 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
      >
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-slate-800 text-slate-400 transition duration-200 group-hover:bg-slate-700 group-hover:text-indigo-300"
          [class.!bg-indigo-400/15]="activeLink.isActive"
          [class.!text-indigo-300]="activeLink.isActive"
        >
          <app-menu-icon class="h-5 w-5" [icon]="option.icon" />
        </span>

        <span class="flex min-w-0 flex-1 flex-col">
          <span class="text-sm font-semibold leading-5 text-slate-100">{{ option.label }}</span>
          <span class="hidden truncate text-xs leading-5 text-slate-500 md:block">{{ option.sublabel }}</span>
        </span>

        @if (option.showFavoritesCount && favoritesCount() > 0) {
          <span class="min-w-6 shrink-0 rounded-full bg-indigo-500 px-2 py-0.5 text-center text-xs font-semibold text-white tabular-nums">
            {{ favoritesCount() }}<span class="sr-only"> favoritos</span>
          </span>
        }

        @if (activeLink.isActive) {
          <span class="h-2 w-2 shrink-0 rounded-full bg-indigo-400 shadow-[0_0_10px_rgba(129,140,248,0.8)]" aria-hidden="true"></span>
        }
      </a>
    }
  </div>
</nav>
