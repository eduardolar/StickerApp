<header class="border-b border-white/5 px-5 pb-6 pt-7">
  <div class="flex items-center gap-3">
    <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-400 to-violet-600 text-lg font-black text-white shadow-lg shadow-indigo-950/40" aria-hidden="true">
      S
    </span>
    <div>
      <p class="text-xl font-bold tracking-tight text-white">Sticker<span class="text-indigo-400">App</span></p>
      <p class="mt-0.5 text-xs text-slate-400">Tu rincón de stickers</p>
    </div>
    <app-theme-toggle class="ml-auto" />
  </div>

  <a
    routerLink="/dashboard/search"
    class="group mt-6 flex items-center gap-3 rounded-xl border border-white/5 bg-white/[0.03] px-3 py-3 transition duration-200 hover:border-indigo-400/20 hover:bg-white/5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
  >
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-400/10 text-indigo-300 transition duration-200 group-hover:bg-indigo-400/20" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
      </svg>
    </span>
    <span class="block">
      <span class="block text-sm font-medium text-slate-200 transition duration-200 group-hover:text-white">Descubre algo nuevo</span>
      <span class="mt-0.5 block text-xs text-slate-400">Busca cualquier sticker</span>
    </span>
  </a>
</header>
