<figure
  class="group relative overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 hover:ring-indigo-300 dark:bg-slate-900 dark:ring-slate-800 dark:hover:ring-indigo-500/50"
>
  <!-- Patrón de puntos para que se aprecie la transparencia del sticker -->
  <div
    class="absolute inset-0 bg-[radial-gradient(var(--color-slate-200)_1px,transparent_1px)] bg-size-[14px_14px] opacity-70 dark:bg-[radial-gradient(var(--color-slate-700)_1px,transparent_1px)]"
    aria-hidden="true"
  ></div>

  <!-- La imagen va dentro de un botón para poder abrir la vista en grande también con el teclado -->
  <button
    type="button"
    [attr.aria-label]="'Ver en grande: ' + (sticker().title || 'sticker')"
    (click)="opened.emit()"
    class="relative block w-full cursor-zoom-in rounded-2xl focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none focus-visible:ring-inset"
  >
    <img
      class="block h-auto w-full p-4 drop-shadow-sm transition duration-300 group-hover:scale-110"
      [src]="sticker().imageUrl"
      [attr.width]="sticker().width"
      [attr.height]="sticker().height"
      [alt]="sticker().title || 'Sticker'"
      [attr.loading]="eager() ? 'eager' : 'lazy'"
    />
  </button>

  <app-sticker-actions
    class="absolute inset-x-2 top-2 block opacity-0 transition duration-300 group-focus-within:opacity-100 group-hover:opacity-100 pointer-coarse:opacity-100"
    [sticker]="sticker()"
    [compact]="true"
  />

  @if (sticker().title) {
    <figcaption
      class="pointer-events-none absolute inset-x-0 bottom-0 translate-y-2 bg-linear-to-t from-slate-900/85 via-slate-900/50 to-transparent px-3 pt-8 pb-3 text-xs font-medium text-white opacity-0 transition duration-300 group-hover:translate-y-0 group-hover:opacity-100"
    >
      <span class="line-clamp-2 capitalize">{{ sticker().title }}</span>
    </figcaption>
  }
</figure>
