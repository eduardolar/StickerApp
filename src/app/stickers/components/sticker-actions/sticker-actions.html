<!-- En pantallas táctiles los botones crecen para el dedo; en las tarjetas (compact) solo quedan
     Favorito y WhatsApp, y Copiar y Descargar se ven en la vista en grande -->
@let touchSize = compact() ? 'pointer-coarse:h-10 pointer-coarse:w-10' : 'pointer-coarse:h-11 pointer-coarse:w-11';
@let hiddenOnTouch = compact() ? 'pointer-coarse:hidden' : '';
<div class="flex flex-wrap justify-end gap-1.5" [class.animate-pulse]="isBusy()">
  <button
    type="button"
    [title]="isFavorite() ? 'Quitar de favoritos' : 'Añadir a favoritos'"
    [attr.aria-label]="'Favorito: ' + (sticker().title || 'sticker')"
    [attr.aria-pressed]="isFavorite()"
    (click)="toggleFavorite()"
    class="flex h-8 w-8 items-center justify-center rounded-full shadow-md ring-1 transition hover:scale-110 focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:ring-offset-2 focus-visible:outline-none dark:focus-visible:ring-offset-slate-900"
    [class]="
      touchSize +
      ' ' +
      (isFavorite()
        ? 'bg-rose-500 text-white ring-rose-500'
        : 'bg-white text-slate-700 ring-slate-200 hover:text-rose-500 dark:bg-slate-800 dark:text-slate-200 dark:ring-slate-700')
    "
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" class="h-4 w-4 pointer-coarse:h-5 pointer-coarse:w-5" [attr.fill]="isFavorite() ? 'currentColor' : 'none'" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
    </svg>
  </button>

  <button
    type="button"
    [title]="copyStatus() === 'copied' ? '¡Enlace copiado!' : copyStatus() === 'error' ? 'No se pudo copiar' : 'Copiar enlace'"
    [attr.aria-label]="'Copiar enlace: ' + (sticker().title || 'sticker')"
    (click)="copyLink()"
    class="flex h-8 w-8 items-center justify-center rounded-full shadow-md ring-1 transition hover:scale-110 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
    [class]="
      touchSize +
      ' ' +
      hiddenOnTouch +
      ' ' +
      (copyStatus() === 'copied'
        ? 'bg-emerald-500 text-white ring-emerald-500'
        : copyStatus() === 'error'
          ? 'bg-red-500 text-white ring-red-500'
          : 'bg-white text-slate-700 ring-slate-200 hover:text-indigo-600 dark:bg-slate-800 dark:text-slate-200 dark:ring-slate-700')
    "
  >
    @if (copyStatus() === 'copied') {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" class="h-4 w-4 pointer-coarse:h-5 pointer-coarse:w-5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" class="h-4 w-4 pointer-coarse:h-5 pointer-coarse:w-5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
      </svg>
    }
  </button>

  <button
    type="button"
    title="Enviar por WhatsApp"
    [attr.aria-label]="'Enviar por WhatsApp: ' + (sticker().title || 'sticker')"
    [disabled]="isBusy()"
    (pointerenter)="prefetch()"
    (pointerdown)="prefetch()"
    (focus)="prefetch()"
    (click)="shareOnWhatsApp()"
    [class]="touchSize"
    class="flex h-8 w-8 items-center justify-center rounded-full bg-[#25D366] text-white shadow-md transition hover:scale-110 hover:bg-[#1ebe5a] focus-visible:ring-2 focus-visible:ring-[#25D366] focus-visible:ring-offset-2 focus-visible:outline-none disabled:cursor-wait dark:focus-visible:ring-offset-slate-900"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4.5 w-4.5 pointer-coarse:h-5.5 pointer-coarse:w-5.5" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
    </svg>
  </button>

  <button
    type="button"
    title="Descargar sticker"
    [attr.aria-label]="'Descargar: ' + (sticker().title || 'sticker')"
    [disabled]="isBusy()"
    (click)="download()"
    [class]="touchSize + ' ' + hiddenOnTouch"
    class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-slate-700 shadow-md ring-1 ring-slate-200 transition hover:scale-110 hover:text-indigo-600 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none disabled:cursor-wait dark:bg-slate-800 dark:text-slate-200 dark:ring-slate-700"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" class="h-4 w-4 pointer-coarse:h-5 pointer-coarse:w-5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
    </svg>
  </button>

  <!-- Avisa a los lectores de pantalla cuando se copia el enlace -->
  <span class="sr-only" aria-live="polite">
    @if (copyStatus() === 'copied') {
      Enlace copiado
    } @else if (copyStatus() === 'error') {
      No se pudo copiar el enlace
    }
  </span>
</div>
