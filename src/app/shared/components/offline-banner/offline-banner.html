<!-- El contenedor con role="status" existe siempre: así el lector de pantalla anuncia el aviso cuando aparece -->
<div role="status">
  @if (!networkStatus.isOnline()) {
    <p class="flex items-center gap-2 rounded-xl bg-slate-100 px-4 py-3 text-sm text-slate-700 ring-1 ring-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:ring-slate-700">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" class="h-5 w-5 shrink-0 text-slate-500 dark:text-slate-400" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
      Sin conexión. Tus favoritos e historial siguen aquí, pero las imágenes necesitan internet.
    </p>
  }
</div>
