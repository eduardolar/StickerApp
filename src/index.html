<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sticker App</title>
  <base href="/">
  <!-- viewport-fit=cover: la app ocupa toda la pantalla del móvil (también bajo la barra de estado) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- La fuente Inter va dentro de la app (public/fonts): así funciona también sin internet -->
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Pone el modo oscuro antes de que cargue Angular, para que la página no parpadee en blanco.
    // Usa la misma clave que ThemeService.
    try {
      const theme = JSON.parse(localStorage.getItem('stickers-theme'));
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (!theme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
