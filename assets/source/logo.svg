<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Logo de StickerApp: pegatina con el degradado de la marca (indigo-400 #818cf8 -> violet-600 #7c3aed),
    una "S" blanca dibujada como trazo (no depende de ninguna fuente) y la esquina inferior derecha despegándose.

    Grupos que usa scripts/render-graphics.mjs para sacar las variantes de icono desde este mismo archivo:
      #tile       pegatina redondeada con la esquina recortada (logo normal)
      #tile-full  cuadrado a sangre sin redondear (oculto aquí; para los iconos, que redondea el sistema)
      #tile-round cuadrado redondeado sin la esquina despegada (oculto aquí; para el favicon)
      #mark       la "S" con su sombra
      #peel       la esquina despegada (solapa + su sombra)
  -->
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="gloss" gradientUnits="userSpaceOnUse" cx="230" cy="150" r="760">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Reverso de la pegatina: más oscuro junto al doblez y claro en la punta -->
    <linearGradient id="flap" gradientUnits="userSpaceOnUse" x1="899" y1="899" x2="841" y2="841">
      <stop offset="0" stop-color="#c7d2fe" />
      <stop offset="0.45" stop-color="#e0e7ff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
    <filter id="flap-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <clipPath id="tile-clip">
      <path d="M230 0H794A230 230 0 0 1 1024 230V774L774 1024H230A230 230 0 0 1 0 794V230A230 230 0 0 1 230 0Z" />
    </clipPath>
  </defs>

  <g id="tile">
    <path d="M230 0H794A230 230 0 0 1 1024 230V774L774 1024H230A230 230 0 0 1 0 794V230A230 230 0 0 1 230 0Z" fill="url(#brand)" />
    <path d="M230 0H794A230 230 0 0 1 1024 230V774L774 1024H230A230 230 0 0 1 0 794V230A230 230 0 0 1 230 0Z" fill="url(#gloss)" />
  </g>

  <g id="tile-full" display="none">
    <rect width="1024" height="1024" fill="url(#brand)" />
    <rect width="1024" height="1024" fill="url(#gloss)" />
  </g>

  <g id="tile-round" display="none">
    <rect width="1024" height="1024" rx="230" fill="url(#brand)" />
    <rect width="1024" height="1024" rx="230" fill="url(#gloss)" />
  </g>

  <g id="mark" filter="url(#mark-shadow)">
    <path
      d="M644.4 353.3A150 108 0 1 0 512 512A150 108 0 1 1 379.6 670.7"
      fill="none"
      stroke="#ffffff"
      stroke-width="128"
      stroke-linecap="round"
    />
  </g>

  <g id="peel">
    <!-- Sombra que la solapa proyecta sobre la pegatina -->
    <g clip-path="url(#tile-clip)">
      <path d="M1024 774L1004 774A230 230 0 0 0 774 1004L774 1024Z" transform="translate(-12 -12)" fill="#1e1b4b" fill-opacity="0.45" filter="url(#flap-shadow)" />
    </g>
    <path d="M1024 774L1004 774A230 230 0 0 0 774 1004L774 1024Z" fill="url(#flap)" />
    <!-- Brillo fino en el doblez -->
    <path d="M1024 774L774 1024" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" />
  </g>
</svg>
